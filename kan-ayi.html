<div id="hud" class="panel hidden">

  <div class="bar"><i id="hpb" style="background:linear-gradient(#e85a5a,#a32525)"></i><i id="shb" style="background:rgba(190,220,255,.55)"></i><span id="hpt"></span></div>
  <div class="bar"><i id="mpb" style="background:linear-gradient(#5a95f0,#2552a8)"></i><span id="mpt"></span></div>
  <div class="bar" style="height:10px"><i id="xpb" style="background:linear-gradient(#b77ce6,#6b2fa0)"></i><span id="xpt" style="font-size:8px;line-height:9px"></span></div>
  <div id="gold"><span id="goldt"></span><span id="buffs"></span></div>
</div>
<div id="target" class="panel hidden"><div id="tname"></div><div class="bar"><i id="thpb" style="background:linear-gradient(#e85a5a,#a32525)"></i><span id="thpt"></span></div></div>
<div id="side" class="hidden">
  <div id="mapbox" class="panel"><canvas id="minimap" width="160" height="160"></canvas><div id="zone"></div></div>
  <div id="questbox" class="panel"></div>
</div>
<div id="chat" class="hidden"><div id="chatlog"></div><input id="chatin" maxlength="120" placeholder="Sohbet için Enter'a bas..." autocomplete="off"></div>
<div id="bar" class="panel hidden"></div>
<div id="toast"></div>

<div id="inv" class="panel win hidden"></div>
<div id="char" class="panel win hidden"></div>

<div id="shop" class="panel win hidden"></div>
<div id="extra" class="panel win hidden"></div>
<div id="bigmap" class="panel win hidden"><button class="x" data-close="bigmap">✕</button><h2 id="bmTitle">Harita</h2><canvas id="bmCanvas" width="480" height="480"></canvas><div class="mut" style="font-size:12px;margin-top:6px">⭐ görev hedefi • ⛩ geçitler • 💀 bosslar • M ile kapat</div></div>
<div id="dialog" class="panel win hidden"><h2 id="dtitle"></h2><div id="dtext"></div><div id="dbtns"></div></div>
<div id="tip" class="panel hidden"></div>
<div id="overlay"><div id="start"></div><div id="death" class="hidden"></div></div>
